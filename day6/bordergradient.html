<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Border</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: black;
        }

        .box {
            width: 200px;
            height: 300px;

            padding: 10px; /* Border thickness */

            border-radius: 20px;

            background: linear-gradient(
                0deg,
                white,
                pink
            );
        }

        .box-content {
            width: 100%;
            height: 100%;

            background-color: black;

            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="box-content"></div>
    </div>

</body>
</html>
