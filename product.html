<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product-card {
        background: #ffffff;
        display: flex;
        flex: wrap;
        justify-content: center;
        gap: 24px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        font-family: Arial, sans-serif;
        transition: transform 0.2s ease;
}

.product-card:hover {
  transform: translateY(-5px);
}
.product-image {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.product-info {
  padding: 16px;
  text-align: center;
  box-shadow: #333333;
}

.product-title {
  font-size: 18px;
  color: #333333;
  margin: 0 0 10px 0;
}

.product-price {
  font-size: 20px;
  color: #2e7d32;
  font-weight: bold;
  margin: 0 0 16px 0;
}

.add-to-cart-btn {
  width: 100%;
  padding: 10px;
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 16px;
  cursor: pointer;
  transition: background-color 0.2s ease;
}

.add-to-cart-btn:hover {
  background-color: #0056b3;
}

    </style>
</head>
<body>
    <h2>Product details</h2>
    <div class="product-card">
  
  <div class="product-info">
    <img src="..." class="img-fluid" alt="...">
    <h3 class="product-title">Nice Running Shoes</h3>
    <p class="product-price">₹1999</p>
    <button class="add-to-cart-btn">Add to Cart</button>
  </div>
  <div class="product-info">
    <img src="..." class="img-fluid" alt="...">
    <h3 class="product-title">Puma Running Shoes</h3>
    <p class="product-price">₹2999</p>
    <button class="add-to-cart-btn">Add to Cart</button>
  </div>
  <div class="product-info">
    <img src="..." class="img-thumbnail" alt="...">
    <h3 class="product-title">Under Armour Running Shoes</h3>
    <p class="product-price">₹2499</p>
    <button class="add-to-cart-btn">Add to Cart</button>
  </div>
</div>

</body>
</html>
