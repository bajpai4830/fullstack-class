<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            outline: 1px solid black;
            display: grid;
            height: 500px;
            width: 500px;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }

        .container>div{
            outline: 1px dashed grey;
            font-size: 30px;
        }

        #box1{
            grid-column-start:1;
            /* grid-column: 1/3; */
            grid-column-end:4;
            grid-row-start:1;
            background-color: cyan;
            grid-row-end:4;
            /* z-index: 2; */
        }
        #box6{
            grid-column: 2/3;
            grid-row: 1/4;
            background-color: blue;
            z-index: 1;
        }
        #box5{
            grid-column: 1/4;
            text-align: center;
            grid-row: 2/3;
            background-color: red;
            z-index:2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
    </div>
</body>
</html>
