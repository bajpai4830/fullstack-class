<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            align-content: center;
        }
        .login-card{
            background-color: aliceblue;
            padding: 40px;
            
            display: flex;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;

        }
        .login-card div {
            margin: 10px;
            align-items: center;
            padding: 20px;
            font-size: 30px;
            }
        .login-card h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #333333;
        }
        

    </style>
</head>
<body>
    <nav></nav>
    <div class="login-card">
        <h2>Login</h2><br>

        <form action="#">
            <div>
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email">
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
            </div>
            
            <button type="submit">Sign in</button>
        </form>



    </div>
</body>
</html>
