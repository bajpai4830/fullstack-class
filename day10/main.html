<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        #mypara{
            color: green;
        }
        .para{
            color: blue;
        }
        p{
            color: red;
        }
        section h2{
            color: yellow;
            text-shadow: 2px 2px 0 black;
        }
        section>h2{
            text-transform: lowercase;
        }
        h2+p{
            color: blue;
        }
        h2~p{
            /* color: red;
             */
             text-transform: uppercase;
        }
    </style>
</head>
<body>
    <p class="para" id="mypara"> Hello World</p>
    <section>
        <h2>Heading</h2>
        <p>para 1</p>
        <p>para 2</p>
        <div>
            <h2>Heading 2</h2>
        </div>
    </section>
</body>
</html>
