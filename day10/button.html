<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:hover{
            background-color: black;
            color: white;
        }
        button:active{
            background-color: blue;
            color: white;
        }
        a:link{
            text-decoration: none;
            color: black;
        }
        a:visited{
            color: green;
        }
        input:checked{
            accent-color: brown;
            box-shadow: 1px 1px 5px black;
        }
        li:nth-child(2n){
            background-color: yellow;

        }
    </style>
</head>
<body>
    <button> Click Me !!</button>
    <a href="#1">Link</a>
    <input type="checkbox" checked/>
    <input type="checkbox"/>

    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        <li>7</li>
    </ul>

</body>
</html>
